[package]
name = "distributed_jobv2"
version = "0.1.0"
edition = "2024"

[dependencies]
ctrlc = "3.5.2"
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sysinfo = "0.33"

[profile.release]
debug = true


[package]
name = "distributed_jobv2"
version = "0.1.0"
edition = "2024"

[dependencies]
ctrlc = "3.5.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
